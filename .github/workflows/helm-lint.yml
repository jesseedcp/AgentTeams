# 作用：在合并 Helm 或本地 K8s 启动脚本改动前，检查品牌替换、依赖、语法和最终渲染结果。
# 触发：相关路径在 PR/main 中变化或手动运行；所有检查均通过才说明 Chart 可被继续发布测试。
# 本 Workflow 使用测试占位凭据渲染模板，不接触生产 Secret，也不会部署到真实集群。
name: Helm Lint

on:
  pull_request:
    paths:
      - 'helm/**'
      - 'hack/local-k8s-up.sh'
      - 'tests/check-agentteams-rename-defaults.sh'
      - 'tests/check-cinny-replacement.sh'
      - 'tests/check-helm-agentteams.sh'
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - 'hack/local-k8s-up.sh'
      - 'tests/check-agentteams-rename-defaults.sh'
      - 'tests/check-cinny-replacement.sh'
      - 'tests/check-helm-agentteams.sh'
  workflow_dispatch: ~

jobs:
  # 顺序很重要：先检查静态契约，再构建依赖、lint，最后用多组 values 做 template dry-run。
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AgentTeams rename contracts
        run: |
          bash tests/check-agentteams-rename-defaults.sh
          bash tests/check-cinny-replacement.sh

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Add dependency repos
        run: helm repo add higress.io https://higress.io/helm-charts

      - name: Build dependencies
        run: helm dependency build helm/agentteams/

      - name: Lint
        run: helm lint helm/agentteams/

      - name: Template dry-run
        run: |
          bash tests/check-helm-agentteams.sh
