# 作用：构建所有 OpenClaw 系 Worker 共用的基础镜像，避免每个 Worker 重复安装相同依赖。
# 触发：只有 main 上的 openclaw-base 发生变化，或维护者手动运行时才执行。
# 通过标准：amd64/arm64 两个平台的 latest 镜像都成功推送；登录凭据只交给 Registry 登录步骤。
name: Build Base Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'openclaw-base/**'

env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
  REPO: agentteams

jobs:
  # 这是一个发布型 job，会写外部镜像仓库；普通代码测试不应复用它的写权限。
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free Up GitHub Actions Ubuntu Runner Disk Space 🔧
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push multi-arch base image
        run: |
          make push-openclaw-base \
            VERSION=latest \
            REGISTRY=${{ env.REGISTRY }} \
            REPO=${{ env.REPO }} \
            HIGRESS_REGISTRY=higress-registry.us-west-1.cr.aliyuncs.com

      - name: Summary
        run: |
          echo "### Base Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- OpenClaw Base: \`${{ env.REGISTRY }}/${{ env.REPO }}/openclaw-base:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Platforms: \`linux/amd64, linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
