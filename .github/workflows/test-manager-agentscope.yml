# 作用：验证 AgentScope Manager 的 Python 行为、Skill/镜像契约及 Linux/Windows 安装器兼容性。
# 触发：Manager、提示词、安装器或相关契约变化时运行；静态 parity 防止代码、Skill 和镜像入口各自演进。
# 测试使用仓库内 fixture 和占位配置，不把真实模型、Matrix 或管理员凭据写入日志和测试产物。
name: AgentScope Manager Tests

on:
  pull_request:
    paths:
      - "manager-agentscope/**"
      - "manager/agent/**"
      - "manager/Dockerfile"
      - "manager/entrypoint.sh"
      - "install/agentteams-install.sh"
      - "install/agentteams-install.ps1"
      - "Makefile"
      - "scripts/export-debug-log.py"
      - "scripts/tests/test_export_debug_log.py"
      - "tests/install/**"
      - "tests/manager-skill-parity.json"
      - "tests/test-28-agentscope-manager-parity.sh"
      - "docs/agentscope-manager-operations.md"
      - "docs/zh-cn/agentscope-manager-operations.md"
      - "docs/manager-guide.md"
      - "docs/zh-cn/manager-guide.md"
      - ".github/workflows/test-manager-agentscope.yml"
  push:
    branches: [main]
    paths:
      - "manager-agentscope/**"
      - "manager/agent/**"
      - "manager/Dockerfile"
      - "manager/entrypoint.sh"
      - "install/agentteams-install.sh"
      - "install/agentteams-install.ps1"
      - "Makefile"
      - "scripts/export-debug-log.py"
      - "scripts/tests/test_export_debug_log.py"
      - "tests/install/**"
      - "tests/manager-skill-parity.json"
      - "tests/test-28-agentscope-manager-parity.sh"
      - "docs/agentscope-manager-operations.md"
      - "docs/zh-cn/agentscope-manager-operations.md"
      - "docs/manager-guide.md"
      - "docs/zh-cn/manager-guide.md"
      - ".github/workflows/test-manager-agentscope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linux job 依次检查依赖锁定、pytest、静态契约和调试导出；任一步失败即阻断。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: manager-agentscope/pyproject.toml

      - name: Install Manager and test dependencies
        run: python -m pip install -e "./manager-agentscope[test]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run AgentScope Manager tests
        run: python -m pytest -q manager-agentscope/tests

      - name: Verify static Manager parity
        run: PYTHON_BIN=python bash tests/test-28-agentscope-manager-parity.sh --static-only

      - name: Verify fork release and installer compatibility
        run: |
          PYTHON_BIN=python bash tests/check-fork-release-chain.sh
          bash tests/install/test-agentscope-manager-install.sh
          bash tests/install/test-pre-1.2-env-compat.sh

      - name: Run debug-export compatibility tests
        run: python -m unittest scripts.tests.test_export_debug_log -v

  # Windows 单独检查 PowerShell 路径、转义和旧环境变量兼容，这些问题 Linux 无法发现。
  test-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify AgentScope Manager installer surface
        shell: pwsh
        run: ./tests/install/test-agentscope-manager-install.ps1

      - name: Verify pre-v1.2 image environment compatibility
        shell: pwsh
        run: ./tests/install/test-pre-1.2-env-compat.ps1

      - name: Verify keep-all upgrade and Matrix AppService secrets
        shell: pwsh
        run: ./tests/install/test-windows-upgrade-appservice.ps1
