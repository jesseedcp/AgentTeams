# 作用：构建 CoPaw Worker 的 Python 分发包，并发布到 PyPI 或手动选择的 TestPyPI。
# 触发：正式 GitHub Release 发布后自动运行；预发布不会自动进入正式 PyPI，也可由维护者手动试发。
# Secret 边界：发布令牌只传给对应上传 Action；构建步骤没有令牌，不能意外把凭据打进 wheel。
name: Publish CoPaw Worker to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  # build 成功只是生成包；只有目标判断成立且上传 Action 成功，整个发布才算通过。
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: |
          cd copaw
          python -m build

      - name: Publish to PyPI
        if: github.event.inputs.target != 'testpypi' && (github.event_name == 'release' || github.event.inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: copaw/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: copaw/dist/
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
