{{- if .Values.cinny.enabled }}
{{- $comp := dict "root" . "component" "cinny" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentteams.cinny.fullname" . }}
  namespace: {{ include "agentteams.namespace" . }}
  labels:
    {{- include "agentteams.component.labels" $comp | nindent 4 }}
spec:
  replicas: {{ .Values.cinny.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentteams.component.selectorLabels" $comp | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/cinny-config: {{ include (print $.Template.BasePath "/cinny/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "agentteams.component.selectorLabels" $comp | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: cinny-config
          configMap:
            name: {{ include "agentteams.cinny.fullname" . }}-config
        - name: cinny-well-known
          configMap:
            name: {{ include "agentteams.cinny.fullname" . }}-config
            items:
              - key: matrix-client
                path: client
      containers:
        - name: cinny
          image: "{{ .Values.cinny.image.repository }}:{{ .Values.cinny.image.tag }}"
          imagePullPolicy: {{ .Values.cinny.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: cinny-config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: cinny-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cinny-well-known
              mountPath: /app/.well-known/matrix
              readOnly: true
          resources:
            {{- toYaml .Values.cinny.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
{{- end }}
