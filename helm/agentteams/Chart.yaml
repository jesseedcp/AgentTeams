apiVersion: v2
# Chart.yaml 描述“这个安装包是什么以及依赖谁”，实际可配置项在 values.yaml，
# Kubernetes 对象在 templates/。dependencies 中的 Higress 会由 Helm 一并渲染；
# Chart.lock 是依赖解析结果，不应手工加注释或直接编辑。
name: agentteams
description: AgentTeams - AI Agent Teams with Matrix-based collaboration and human-in-the-loop oversight
type: application
version: 1.1.1
appVersion: "1.1.1"

keywords:
  - ai-agent
  - multi-agent
  - matrix
  - collaboration
  - llm

home: https://github.com/jesseedcp/AgentTeams
sources:
  - https://github.com/jesseedcp/AgentTeams

maintainers:
  - name: AgentTeams Team
    url: https://github.com/jesseedcp/AgentTeams

dependencies:
  # Higress 是共享网关，不属于某个 Worker；一套部署只需一份，由所有 Agent 共用。
  - name: higress
    version: "2.2.1"
    repository: "https://higress.io/helm-charts"
    condition: gateway.higress.enabled
