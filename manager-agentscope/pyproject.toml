[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentteams-manager"
version = "0.1.0"
description = "AgentScope 2.0 runtime for the AgentTeams Manager"
requires-python = ">=3.11"
dependencies = [
  "agentscope[s3]==2.0.4.post1",
  "matrix-nio[e2e]>=0.24.0",
  "httpx>=0.27.0,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
agentteams-manager = "agentteams_manager.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["aioboto3", "nio", "nio.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
